<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Zotero Canvas dashboard</title><link rel="icon" href="icon.png"/><link rel="stylesheet" href="dashboard.css"/>
<script src="objects.js" defer="defer"></script><script src="settings.js" defer="defer"></script><script src="formats.js" defer="defer"></script><script src="model.js" defer="defer"></script><script src="dashboard.js" defer="defer"></script></head>
<body>
<header class="topbar"><div class="brand"><img src="icon.png" alt="" width="36" height="36"/><div><strong>Zotero Canvas</strong><small>Your canvas library</small></div></div><button id="open-editor" type="button">Open canvas editor <span aria-hidden="true">↗</span></button></header>
<main><div class="intro"><div><p class="eyebrow">YOUR WORKSPACE</p><h1>Make room for the next idea.</h1><p>Pick up a canvas or start a fresh line of thought.</p></div><div id="library-count" class="library-count" aria-live="polite"></div></div>
<section class="create" aria-label="Create"><button id="new-freeform" class="create-card freeform" type="button"><span class="create-icon" aria-hidden="true">▦</span><strong>Freeform canvas</strong><small>Place and connect ideas anywhere</small></button><button id="new-mindmap" class="create-card mindmap" type="button"><span class="create-icon" aria-hidden="true">✳</span><strong>Mind map</strong><small>Grow a connected thought tree</small></button><button id="new-folder" class="create-card folder" type="button"><span class="create-icon" aria-hidden="true">▱</span><strong>New folder</strong><small>Keep related canvases together</small></button></section>
<section class="structured-create" aria-label="Structured formats"><div class="structured-head"><p class="eyebrow">STRUCTURED VIEWS</p><h2>Start with a question, then arrange the evidence.</h2></div><div class="structured-grid"><button type="button" data-create-mode="conceptmap"><strong>Concept Map</strong><small>Place a concept at the centre</small></button><button type="button" data-create-mode="evidence"><strong>Evidence map</strong><small>Claims, support, critique</small></button><button type="button" data-create-mode="matrix"><strong>Comparison matrix</strong><small>Sources across themes</small></button><button type="button" data-create-mode="timeline"><strong>Timeline</strong><small>Arguments through time</small></button><button type="button" data-create-mode="literature"><strong>Literature map</strong><small>Works by concept</small></button><button type="button" data-create-mode="process"><strong>Process diagram</strong><small>Ordered analytical steps</small></button></div></section>
<div class="content-layout"><aside class="sidebar" aria-label="Canvas folders"><h2>Library</h2><button id="all-canvases" class="folder-row active" type="button">All canvases <span id="all-count"></span></button><div id="folders"></div></aside>
<section class="recent" aria-label="Recent canvases"><div class="section-head"><div><p class="eyebrow">PICK UP WHERE YOU LEFT OFF</p><h2 id="view-title">Recent canvases</h2></div><div class="view-controls"><label class="search"><span class="visually-hidden">Find a canvas</span><input id="search" type="search" placeholder="Find a canvas"/></label><div class="view-switch" role="group" aria-label="View style"><button id="grid-view" type="button" aria-label="Grid view" aria-pressed="true">▦</button><button id="list-view" type="button" aria-label="List view" aria-pressed="false">☷</button></div></div></div><div id="status" role="status"></div><div id="canvases" class="canvas-grid"></div></section></div>
</main>
<div id="dialog-shade" class="dialog-shade" hidden="hidden"><form id="create-dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><h2 id="dialog-title">New canvas</h2><label for="new-name">Name</label><input id="new-name" maxlength="200" required="required"/><div class="dialog-actions"><button id="cancel-dialog" type="button">Cancel</button><button id="confirm-dialog" type="submit">Create</button></div></form></div>
</body></html>
